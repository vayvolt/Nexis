name: CI

on:
  push:
  pull_request:

jobs:
  qa:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mariadb:11.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: nexis
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: intl, pdo_mysql, pdo_sqlite, gd, zip, sodium, curl
          coverage: none
      - name: Write .env
        run: |
          cat > .env <<'EOF'
          APP_ENV=local
          APP_DEBUG=true
          APP_URL=http://localhost/nexis
          APP_KEY=ci-test-key-not-for-production-use-32
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=nexis
          DB_USERNAME=root
          DB_PASSWORD=root
          MAIL_TRANSPORT=log
          MAIL_FROM_ADDRESS=noreply@localhost
          MAIL_FROM_NAME=Nexis
          EOF
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Migrate
        run: php bin/migrate.php
      - name: PHPUnit
        run: vendor/bin/phpunit
      - name: PHPStan
        run: vendor/bin/phpstan analyse
      - name: Composer audit
        run: composer audit
